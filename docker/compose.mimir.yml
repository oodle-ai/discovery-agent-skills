services:
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: mimir
      MINIO_ROOT_PASSWORD: mimirpass
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 mimir mimirpass
        mc mb --ignore-existing local/mimir-blocks
        mc mb --ignore-existing local/mimir-ruler
        mc mb --ignore-existing local/mimir-alertmanager

  mimir:
    image: grafana/mimir:2.14.0
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    command:
      - -config.file=/etc/mimir/mimir.yaml
      - -config.expand-env=true
    volumes:
      - ./mimir.yaml:/etc/mimir/mimir.yaml:ro
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v2.54.0
    depends_on:
      mimir:
        condition: service_started
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  seed:
    image: curlimages/curl:latest
    depends_on:
      mimir:
        condition: service_started
      prometheus:
        condition: service_started
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Waiting for Mimir to become ready..."
        for i in $$(seq 1 60); do
          if curl -sf http://mimir:8080/ready > /dev/null 2>&1; then
            echo "Mimir ready after $${i}s"
            break
          fi
          sleep 1
        done
        echo "Waiting 30s for Prometheus to scrape Mimir internal metrics..."
        sleep 30
        echo "Seeding complete — Mimir should now have internal metrics."
        echo "Run the collector with:"
        echo "  uv run collectors/mimir/collect.py --endpoint http://localhost:8080 --output-dir ./discovery-output/mimir"
