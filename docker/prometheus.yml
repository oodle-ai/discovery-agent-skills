global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Write scraped metrics to Mimir via remote_write
remote_write:
  - url: http://mimir:8080/api/v1/push

scrape_configs:
  # Scrape Mimir's own internal metrics — this makes cortex_*
  # and thanos_* metrics available for the collector to query
  - job_name: mimir
    static_configs:
      - targets: ["mimir:8080"]
    metrics_path: /metrics

  # Scrape Prometheus itself for some baseline metric variety
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
