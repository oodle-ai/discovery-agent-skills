global:
  scrape_interval: 15s
  external_labels:
    cluster: test
    replica: prom-0

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: thanos-sidecar
    static_configs:
      - targets: ['localhost:10902']

  - job_name: thanos-querier
    static_configs:
      - targets: ['thanos-querier:10902']
