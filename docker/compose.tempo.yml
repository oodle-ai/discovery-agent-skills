services:
  tempo:
    image: grafana/tempo:2.5.0
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./tempo-config.yml:/etc/tempo/config.yaml
    command: -config.file=/etc/tempo/config.yaml

  prometheus:
    image: prom/prometheus:v2.54.0
    ports: ["9090:9090"]
    volumes:
      - ./prometheus-tempo.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'

  telemetrygen:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
    depends_on: [tempo]
    command:
      - traces
      - --otlp-endpoint=tempo:4317
      - --otlp-insecure
      - --traces=1000
      - --workers=2
      - --rate=50

  seed:
    image: curlimages/curl:latest
    depends_on: [tempo, prometheus, telemetrygen]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Tempo..."
        until curl -sf http://tempo:3200/ready; do sleep 2; done
        echo "Waiting 60s for traces + metrics to accumulate..."
        sleep 60
        echo ""
        echo "=== Ready to test ==="
        echo "uv run collectors/promstack/collect.py --endpoint http://localhost:9090 --tempo-endpoint http://localhost:3200 --output-dir ./discovery-output/promstack"
